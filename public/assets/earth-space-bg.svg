<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Space Gradient -->
    <radialGradient id="spaceGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0c1a3a" />
      <stop offset="45%" stop-color="#050c1e" />
      <stop offset="85%" stop-color="#02050e" />
      <stop offset="100%" stop-color="#010308" />
    </radialGradient>

    <!-- Earth Atmosphere Rim Glow -->
    <radialGradient id="atmoGlow" cx="50%" cy="140%" r="95%">
      <stop offset="68%" stop-color="#00f0ff" stop-opacity="0.95" />
      <stop offset="72%" stop-color="#0ea5e9" stop-opacity="0.8" />
      <stop offset="78%" stop-color="#2563eb" stop-opacity="0.4" />
      <stop offset="88%" stop-color="#0f172a" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Earth Body Gradient -->
    <radialGradient id="earthBody" cx="50%" cy="130%" r="75%">
      <stop offset="0%" stop-color="#061226" />
      <stop offset="60%" stop-color="#030814" />
      <stop offset="100%" stop-color="#010307" />
    </radialGradient>

    <!-- Sunrise / Sun Glow behind Earth Horizon -->
    <radialGradient id="sunGlow" cx="82%" cy="65%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="15%" stop-color="#7dd3fc" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Network Arc Gradients -->
    <linearGradient id="arc1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="arc2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="arc3" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters for glows -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Deep Space Background -->
  <rect width="1920" height="1080" fill="url(#spaceGrad)" />

  <!-- 2. Distant Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="150" cy="120" r="1.2" />
    <circle cx="280" cy="80" r="1.5" opacity="0.9" />
    <circle cx="420" cy="190" r="0.8" />
    <circle cx="560" cy="95" r="1.1" />
    <circle cx="720" cy="160" r="1.4" opacity="0.8" />
    <circle cx="890" cy="70" r="1" />
    <circle cx="1050" cy="140" r="1.3" opacity="0.85" />
    <circle cx="1210" cy="85" r="0.9" />
    <circle cx="1380" cy="180" r="1.5" opacity="0.9" />
    <circle cx="1520" cy="110" r="1" />
    <circle cx="1690" cy="145" r="1.2" />
    <circle cx="1820" cy="90" r="1.6" opacity="0.95" />
    
    <circle cx="90" cy="320" r="1" />
    <circle cx="210" cy="410" r="0.8" />
    <circle cx="340" cy="360" r="1.3" />
    <circle cx="1600" cy="310" r="1.2" />
    <circle cx="1740" cy="420" r="1.4" />
    <circle cx="1850" cy="350" r="1" />
  </g>

  <!-- 3. Sunrise / Sunburst on East Horizon -->
  <circle cx="1580" cy="720" r="450" fill="url(#sunGlow)" />

  <!-- 4. Atmosphere Outer Halo -->
  <ellipse cx="960" cy="1450" rx="1450" ry="850" fill="url(#atmoGlow)" />

  <!-- 5. Earth Solid Body Horizon -->
  <ellipse cx="960" cy="1450" rx="1420" ry="820" fill="url(#earthBody)" />

  <!-- 6. Atmosphere Razor-sharp Luminous Rim Line -->
  <ellipse cx="960" cy="1450" rx="1420" ry="820" fill="none" stroke="#7dd3fc" stroke-width="3" opacity="0.85" filter="url(#glowFilter)" />
  <ellipse cx="960" cy="1450" rx="1420" ry="820" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.5" filter="url(#softGlow)" />

  <!-- 7. Night City Lights Clusters (Earth Surface) -->
  <g fill="#fbbf24" opacity="0.75" filter="url(#glowFilter)">
    <!-- Seoul / East Asia Cluster -->
    <circle cx="920" cy="780" r="3.5" fill="#fef08a" />
    <circle cx="935" cy="790" r="2.5" />
    <circle cx="910" cy="795" r="2" />
    <circle cx="945" cy="805" r="3" fill="#fef08a" />
    <circle cx="895" cy="815" r="2.2" />
    <circle cx="870" cy="800" r="2" />

    <!-- Tokyo / Japan Arch Cluster -->
    <circle cx="1120" cy="810" r="3.8" fill="#ffffff" />
    <circle cx="1145" cy="825" r="3" />
    <circle cx="1170" cy="845" r="2.8" />
    <circle cx="1100" cy="830" r="2.5" />
    <circle cx="1080" cy="840" r="2.2" />
    <circle cx="1195" cy="870" r="2.5" />

    <!-- Southeast Asia / China Coast Cluster -->
    <circle cx="750" cy="840" r="3.2" fill="#fef08a" />
    <circle cx="730" cy="860" r="2.5" />
    <circle cx="710" cy="880" r="3" />
    <circle cx="680" cy="855" r="2.2" />
    <circle cx="650" cy="890" r="2.8" />
    <circle cx="780" cy="870" r="2" />

    <!-- Other Global Nodes -->
    <circle cx="480" cy="910" r="2.5" />
    <circle cx="420" cy="930" r="2" />
    <circle cx="360" cy="940" r="2.8" />
    <circle cx="1350" cy="860" r="3" fill="#fef08a" />
    <circle cx="1420" cy="890" r="2.5" />
    <circle cx="1510" cy="920" r="2.2" />
  </g>

  <!-- Golden / Amber Light Trails on Earth -->
  <path d="M710 880 Q800 830 920 780 T1120 810" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.5" />
  <path d="M920 780 Q1010 815 1145 825 T1350 860" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4" />
  <path d="M480 910 Q600 870 750 840 T920 780" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.35" />

  <!-- 8. Orbital High-Tech Arcs (Global Network) -->
  <path d="M220 980 C 450 680, 850 620, 1280 730" fill="none" stroke="url(#arc1)" stroke-width="2.2" filter="url(#glowFilter)" />
  <path d="M540 920 C 720 620, 1180 580, 1680 750" fill="none" stroke="url(#arc2)" stroke-width="2" filter="url(#glowFilter)" />
  <path d="M380 950 C 680 540, 1320 560, 1780 820" fill="none" stroke="url(#arc3)" stroke-width="1.8" stroke-dasharray="8 6" opacity="0.8" />
  <path d="M820 900 C 1020 660, 1380 680, 1580 880" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />

  <!-- 9. Luminous Orbital Nodes (Intersections) -->
  <g filter="url(#glowFilter)">
    <!-- Main Node 1 -->
    <circle cx="850" cy="670" r="5" fill="#38bdf8" />
    <circle cx="850" cy="670" r="2.5" fill="#ffffff" />
    <circle cx="850" cy="670" r="14" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5" />

    <!-- Main Node 2 -->
    <circle cx="1180" cy="640" r="6" fill="#00f0ff" />
    <circle cx="1180" cy="640" r="3" fill="#ffffff" />
    <circle cx="1180" cy="640" r="18" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" />

    <!-- Main Node 3 -->
    <circle cx="680" cy="740" r="4.5" fill="#38bdf8" />
    <circle cx="680" cy="740" r="2" fill="#ffffff" />

    <!-- Main Node 4 -->
    <circle cx="1420" cy="740" r="5" fill="#60a5fa" />
    <circle cx="1420" cy="740" r="2.5" fill="#ffffff" />
  </g>
</svg>
